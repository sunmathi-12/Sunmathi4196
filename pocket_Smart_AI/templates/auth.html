{% extends "base.html" %}{% block body %}
<h1>{{ "Create your account" if mode == "register" else "Log in" }}</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/{{ mode }}">
<label>Username<input name="username" required autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"></label>
<button>{{ "Register" if mode == "register" else "Log in" }}</button></form>
<p>{% if mode == "register" %}Have an account? <a href="/login">Log in</a>{% else %}New here? <a href="/register">Register</a>{% endif %}</p>
{% endblock %}
